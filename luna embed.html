<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ルナ動画埋め込みサンプル</title>
<style>
  body {
    margin: 0;
    padding: 24px;
    background: #12101c;
    font-family: -apple-system, "Hiragino Sans", sans-serif;
    display: flex;
    justify-content: center;
  }

  .video-wrap {
    position: relative;
    width: 100%;
    max-width: 480px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    background: #000;
  }

  .video-wrap video {
    display: block;
    width: 100%;
    height: auto;
  }

  /* 独自の再生ボタン：顔にかぶらないよう下寄りに配置 */
  .play-btn {
    position: absolute;
    left: 50%;
    bottom: 18%;           /* ← ここで高さを調整。顔の位置に合わせて変更可 */
    transform: translate(-50%, 0);
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: rgba(20, 10, 30, 0.55);
    border: 2px solid rgba(255,255,255,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .play-btn:hover {
    background: rgba(120, 60, 160, 0.75);
    transform: translate(-50%, 0) scale(1.06);
  }

  .play-btn svg {
    width: 24px;
    height: 24px;
    margin-left: 3px; /* 三角形の視覚的な中心合わせ */
    fill: #fff;
  }

  .video-wrap.playing .play-btn {
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="video-wrap" id="wrap">
  <video id="lunaVideo" poster="poster.jpg" playsinline webkit-playsinline>
    <source src="luna_final_synced.mp4" type="video/mp4">
  </video>
  <div class="play-btn" id="playBtn">
    <svg viewBox="0 0 24 24"><polygon points="5,3 21,12 5,21"></polygon></svg>
  </div>
</div>

<script>
  const video = document.getElementById('lunaVideo');
  const wrap = document.getElementById('wrap');
  const btn = document.getElementById('playBtn');

  btn.addEventListener('click', () => {
    video.play();
  });

  video.addEventListener('play', () => wrap.classList.add('playing'));
  video.addEventListener('pause', () => wrap.classList.remove('playing'));
  video.addEventListener('ended', () => wrap.classList.remove('playing'));

  // 動画をタップしたら一時停止/再開（任意）
  video.addEventListener('click', () => {
    if (video.paused) { video.play(); } else { video.pause(); }
  });
</script>

</body>
</html>
